version: 2
# Describes the gold layer: business-ready tables for the dashboard

models:
  - name: fct_runs
    description: One row per run (walks and hikes excluded), in local Nairobi time and human units.
    columns:
      - name: activity_id
        description: Strava's activity ID. Primary key.
        data_tests:
          - unique
          - not_null
      - name: run_date
        description: Date of the run in local time.
        data_tests:
          - not_null
      - name: distance_km
        data_tests:
          - not_null
      - name: pace_s_per_km
        description: Moving time per km, in seconds. Lower is faster.
      - name: training_load
        description: Perceived exertion x moving minutes (Foster session-RPE). NULL when the run wasn't rated.

  - name: fct_weekly_runs
    description: One row per ISO week (Monday start), including weeks with no runs (zeros). Periodic snapshot of fct_runs.
    columns:
      - name: week_start
        description: Monday of the week, local time.
        data_tests:
          - unique
          - not_null
      - name: distance_km
        data_tests:
          - not_null
      - name: training_load
        description: Sum of rated runs' load. NULL when no run that week was rated (unknown, not zero).

  - name: fct_daily_fitness
    description: One row per day from the first to the last run. Rolling training load (fitness 42-day, fatigue 7-day, form = fitness - fatigue). Unrated runs use the average effort rating.
    columns:
      - name: day
        data_tests:
          - unique
          - not_null
      - name: training_load
        description: Sum of the day's run loads (effort x minutes). 0 on rest days.
        data_tests:
          - not_null
      - name: estimated_runs
        description: How many of the day's runs had no effort rating and used the average instead.
      - name: fitness
        description: Total load over the last 42 days divided by 42.
      - name: fatigue
        description: Total load over the last 7 days divided by 7.
      - name: form
        description: Fitness minus fatigue. Positive = fresh, negative = tired.

  - name: fct_best_efforts
    description: One row per run per effort distance (5K, 10K, half) that the run was long enough for. Fastest stretch from the GPS track, on a 10 m grid.
    columns:
      - name: effort
        data_tests:
          - accepted_values:
              arguments:
                values: ['5K', '10K', 'Half marathon']
      - name: best_time_s
        description: Fastest elapsed seconds over the effort distance within this run (includes pauses).
        data_tests:
          - not_null
      - name: is_personal_best
        description: True if this was the fastest time for this effort up to that date.